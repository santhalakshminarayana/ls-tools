<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Decode a JWT header and payload locally.">
  <title>JWT decoder | LS Tools</title>
  <link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/theme.js"></script>
  <script defer src="/assets/persistence.js"></script>
  <script defer src="/assets/editor.js"></script>
  <script defer src="/assets/jwt.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="/">LS Tools</a>
      <nav class="site-nav" aria-label="Tools">
        <a href="/json">JSON</a>
        <a href="/base64">Base64</a>
        <a href="/jwt" aria-current="page">JWT</a>
        <a href="/graphql">GraphQL</a>
        <a href="/python">Python</a>
        <a href="/go">Go</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme"></button>
    </div>
  </header>

  <main class="page page-tool">
    <h1 class="tool-title">JWT decoder</h1>

    <div class="field-group">
      <label for="jwt-input">Encoded JWT</label>
      <textarea id="jwt-input" class="token-editor" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="eyJhbGciOi...eyJzdWIiOi...signature"></textarea>
    </div>

    <div class="button-bar" role="group" aria-label="JWT actions">
      <button id="jwt-decode" type="button">Decode</button>
      <button id="jwt-copy-payload" class="secondary" type="button">Copy payload</button>
      <button id="jwt-clear" class="secondary" type="button">Clear</button>
    </div>

    <div class="two-pane">
      <div class="field-group">
        <label for="jwt-header">Header</label>
        <textarea id="jwt-header" class="data-editor jwt-output" readonly spellcheck="false" aria-describedby="jwt-status"></textarea>
      </div>
      <div class="field-group">
        <label for="jwt-payload">Payload</label>
        <textarea id="jwt-payload" class="data-editor jwt-output" readonly spellcheck="false" aria-describedby="jwt-status"></textarea>
      </div>
    </div>
    <p id="jwt-status" class="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
